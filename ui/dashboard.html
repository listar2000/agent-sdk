<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard</title>
<style>
:root {
  --bg: #0d0f13;
  --surface: #151a23;
  --surface2: #1b2130;
  --border: #2a303a;
  --text: #d9dee7;
  --muted: #7b8492;
  --accent: #6b91ff;
  --success: #4bb382;
  --warning: #d2a254;
  --danger: #d46b6b;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "SF Pro Text", -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}

.left-panel {
  width: 320px;
  min-width: 260px;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.left-top {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.left-top h1 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.left-top h1 .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--success);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.stat {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 6px;
  text-align: center;
}
.stat .val { font-size: 1.3rem; font-weight: 700; color: var(--accent); line-height: 1; }
.stat .val.green { color: var(--success); }
.stat .val.amber { color: var(--warning); }
.stat .lbl { font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }

.health-bar {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.68rem;
  color: var(--muted);
}
.health-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.health-dot.ok { background: var(--success); }
.health-dot.err { background: var(--danger); }

.section-hdr {
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.07em;
  padding: 12px 16px 6px;
  flex-shrink: 0;
}
.session-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  padding: 0 10px 10px;
}
.session-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 11px;
  margin-bottom: 5px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  display: flex;
  align-items: center;
  gap: 9px;
}
.session-item:hover { background: var(--surface2); border-color: #3a404d; }
.session-item.selected { border-color: var(--accent); background: var(--surface2); }
.session-item.busy .dot-ind { background: var(--accent); box-shadow: 0 0 5px var(--accent); animation: pulse 1.5s infinite; }
.dot-ind { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
.session-item .info { flex: 1; min-width: 0; }
.session-item .s-name { font-size: 0.78rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-item .s-sub { font-size: 0.65rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.session-item .s-badge {
  font-size: 0.6rem; font-weight: 600; padding: 2px 5px; border-radius: 4px;
  flex-shrink: 0; text-transform: uppercase; letter-spacing: 0.04em;
}
.badge-running { background: rgba(107,145,255,0.15); color: var(--accent); }
.badge-idle { background: rgba(123,132,146,0.12); color: var(--muted); }

/* Right panel */
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--bg);
}
.stream-header {
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  flex-shrink: 0;
}
.stream-header .s-title { font-size: 0.88rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stream-header .s-meta { font-size: 0.68rem; color: var(--muted); margin-left: 10px; flex-shrink: 0; }
.close-btn {
  background: none; border: 1px solid var(--border); border-radius: 6px;
  color: var(--muted); padding: 3px 9px; font-size: 0.72rem; cursor: pointer;
  flex-shrink: 0; margin-left: 12px;
}
.close-btn:hover { border-color: var(--danger); color: var(--danger); }

.stream-body {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  font-size: 0.81rem;
  line-height: 1.6;
}
.stream-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  font-size: 0.88rem;
}

.ev { margin-bottom: 7px; }
.ev.agent-text {
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--surface);
  border-left: 3px solid var(--accent);
  white-space: pre-wrap;
  word-break: break-word;
}
.ev.thinking {
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(123,132,146,0.07);
  border-left: 3px solid var(--muted);
  color: var(--muted);
  font-style: italic;
  font-size: 0.76rem;
}
.ev.error-ev {
  padding: 7px 12px;
  border-radius: 8px;
  background: rgba(212,107,107,0.08);
  border-left: 3px solid var(--danger);
  color: var(--danger);
}
.ev.usage-ev {
  padding: 5px 12px;
  border-radius: 6px;
  background: transparent;
  font-size: 0.68rem;
  color: var(--muted);
  border-left: 2px solid var(--border);
}
.ev .ev-label {
  font-size: 0.6rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 3px;
  opacity: 0.55;
}
.tool-card {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  overflow: hidden;
  margin-bottom: 5px;
}
.tool-card summary {
  cursor: pointer;
  list-style: none;
  padding: 7px 11px;
  color: var(--accent);
  font-size: 0.76rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}
.tool-card summary::-webkit-details-marker { display: none; }
.tool-card summary .tool-icon { font-size: 0.65rem; opacity: 0.45; }
.tool-card summary .tool-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-card summary .tool-status { font-size: 0.65rem; font-weight: 600; flex-shrink: 0; }
.tool-status.waiting { color: var(--warning); }
.tool-status.done { color: var(--success); }
.tool-card pre {
  padding: 0 11px 9px;
  color: var(--muted);
  font-family: "SF Mono", "JetBrains Mono", monospace;
  font-size: 0.7rem;
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 280px;
  overflow-y: auto;
}
</style>
</head>
<body>

<div class="left-panel">
  <div class="left-top">
    <h1><span class="dot"></span> Agent Dashboard</h1>
    <div class="stats-row">
      <div class="stat"><div class="val" id="statSessions">-</div><div class="lbl">Sessions</div></div>
      <div class="stat"><div class="val amber" id="statBusy">-</div><div class="lbl">Busy</div></div>
      <div class="stat"><div class="val" id="statInstances">-</div><div class="lbl">Sandboxes</div></div>
    </div>
    <div class="health-bar">
      <span class="health-dot" id="healthDot"></span>
      <span id="healthText">connecting...</span>
    </div>
  </div>

  <div class="section-hdr">Sessions <span id="sessionCount" style="font-weight:400;opacity:.6"></span></div>
  <ul class="session-list" id="sessionList">
    <li style="color:var(--muted);padding:16px 6px;font-size:0.82rem;">Loading...</li>
  </ul>
</div>

<div class="right-panel">
  <div class="stream-header" id="streamHeader" style="display:none">
    <span class="s-title" id="streamTitle">-</span>
    <span class="s-meta" id="streamMeta"></span>
    <button class="close-btn" onclick="closeStream()">Close</button>
  </div>
  <div class="stream-body" id="streamBody">
    <div class="stream-empty">Select a session to view its live event stream</div>
  </div>
</div>

<script>
const API = 'https://agent-sdk-server-production.up.railway.app';
let currentSessionId = null;
let currentEventSource = null;
let agentNames = {};  // agent_id -> name

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

async function fetchJSON(url) {
  try {
    const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

// --- Main refresh ---
async function refresh() {
  const [admin, health] = await Promise.all([
    fetchJSON(`${API}/admin/sessions`),
    fetchJSON(`${API}/health`),
  ]);

  // Health indicator
  const dot = document.getElementById('healthDot');
  const txt = document.getElementById('healthText');
  if (health) {
    dot.className = 'health-dot ok';
    const parts = [];
    if (health.executor_threads != null) parts.push(`${health.executor_threads}/${health.executor_max} threads`);
    if (health.live_shells != null) parts.push(`${health.live_shells} shells`);
    txt.textContent = parts.length ? parts.join(' · ') : 'ok';
  } else {
    dot.className = 'health-dot err';
    txt.textContent = 'unreachable';
  }

  if (!admin) return;

  const sessions = (admin.sessions || []).filter(s => !s.shutdown);
  const busy = sessions.filter(s => s.agent_busy).length;
  const instances = (admin.instances || []).length;

  document.getElementById('statSessions').textContent = sessions.length;
  document.getElementById('statBusy').textContent = busy;
  document.getElementById('statInstances').textContent = instances;
  document.getElementById('sessionCount').textContent = `(${sessions.length})`;

  // Cache agent names
  if (sessions.some(s => !agentNames[s.agent_id])) {
    const agents = await fetchJSON(`${API}/agents`);
    if (agents) {
      for (const a of agents) {
        if (a.name) agentNames[a.id] = a.name;
      }
    }
  }

  const list = document.getElementById('sessionList');
  if (sessions.length === 0) {
    list.innerHTML = '<li style="color:var(--muted);padding:14px 6px;font-size:0.8rem;">No active sessions</li>';
    return;
  }

  const items = sessions.map(s => {
    const name = agentNames[s.agent_id] || s.agent_id.slice(0, 8);
    const isSelected = s.session_id === currentSessionId;
    const agentType = s.agent_type || '';
    const sub = [agentType, s.provider].filter(Boolean).join(' · ');
    return `
      <li class="session-item ${s.agent_busy ? 'busy' : ''} ${isSelected ? 'selected' : ''}"
          onclick="openStream('${s.session_id}', '${escHtml(name)}', '${escHtml(s.agent_type || '')}', this)">
        <div class="dot-ind"></div>
        <div class="info">
          <div class="s-name">${escHtml(name)}</div>
          ${sub ? `<div class="s-sub">${escHtml(sub)}</div>` : ''}
          ${s.sandbox_ref ? `<div title="${escHtml(s.sandbox_ref)}" style="font-family:ui-monospace,monospace;font-size:0.62rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escHtml(s.sandbox_ref)}</div>` : ''}
        </div>
        <span class="s-badge ${s.agent_busy ? 'badge-running' : 'badge-idle'}">${s.agent_busy ? 'running' : 'idle'}</span>
      </li>`;
  });
  list.innerHTML = items.join('');

  // Update stream header meta if a session is open
  if (currentSessionId) {
    const cur = sessions.find(s => s.session_id === currentSessionId);
    if (cur) {
      document.getElementById('streamMeta').textContent =
        cur.agent_busy ? 'running' : 'idle';
    }
  }
}

// --- Event stream ---
function openStream(sessionId, name, agentType, el) {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  currentSessionId = sessionId;

  document.getElementById('streamHeader').style.display = 'flex';
  document.getElementById('streamTitle').textContent = name;
  document.getElementById('streamMeta').textContent = agentType || '';

  const body = document.getElementById('streamBody');
  body.innerHTML = '<div style="color:var(--muted);padding:8px;font-size:0.8rem;">Loading history...</div>';

  document.querySelectorAll('.session-item').forEach(i => i.classList.remove('selected'));
  if (el) el.classList.add('selected');

  loadLog(sessionId, body).then(() => connectSSE(sessionId, body));
}

async function loadLog(sessionId, body) {
  const log = await fetchJSON(`${API}/sessions/${sessionId}/log`);
  body.innerHTML = '';
  if (!log || log.length === 0) return;
  for (const e of log) appendEvent(body, e.event_type, e.payload);
  body.scrollTop = body.scrollHeight;
}

function connectSSE(sessionId, body) {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  if (sessionId !== currentSessionId) return;

  const es = new EventSource(`${API}/sessions/${sessionId}/events`);
  currentEventSource = es;

  es.onmessage = (msg) => {
    if (sessionId !== currentSessionId) { es.close(); return; }
    try {
      const data = JSON.parse(msg.data);
      if (data.jsonrpc && data.result?.stopReason) {
        appendEvent(body, 'done', {text: `Done (${data.result.stopReason})`});
      } else if (data.jsonrpc && data.method === 'notifications/message') {
        const update = data.params?.update;
        if (!update) return;
        const su = update.sessionUpdate;
        if (su === 'text_message_start' || su === 'text_message_content') {
          appendEvent(body, 'assistant_message', {text: update.messagePart?.text || update.textDelta || ''});
        } else if (su === 'tool_call_begin') {
          appendEvent(body, 'tool_call', {name: update.toolName || '?', input: update.input || update.arguments || ''});
        } else if (su === 'tool_call_result') {
          appendEvent(body, 'tool_result', {output: update.output || update.result || ''});
        } else if (su === 'thinking_message_start' || su === 'thinking_message_content') {
          appendEvent(body, 'reasoning', {text: update.thinkingDelta || update.messagePart?.text || ''});
        } else if (su === 'usage_update') {
          appendEvent(body, 'usage', update);
        }
      }
    } catch {}
  };

  es.addEventListener('error', () => {
    if (sessionId !== currentSessionId) return;
    appendEvent(body, 'system', {text: 'Stream disconnected'});
  });
}

// --- Event rendering ---
function extractName(p) { return p.tool || p.name || p.tool_name || p.toolName || '?'; }
function extractTitle(p) {
  if (p.title) return p.title;
  const inp = p.input || p.args || {};
  if (typeof inp === 'string') return inp.slice(0, 100);
  if (inp.command) return inp.command.slice(0, 100);
  if (inp.file_path || inp.filePath) return inp.file_path || inp.filePath;
  if (inp.path) return inp.path;
  if (Object.keys(inp).length) return JSON.stringify(inp).slice(0, 100);
  return '';
}
function extractResult(p) {
  const res = p.result;
  if (typeof res === 'string') return res;
  if (Array.isArray(res)) return res.map(r => r.content?.text || r.text || JSON.stringify(r)).join('\n');
  if (res && typeof res === 'object') return res.stdout || res.text || res.output || JSON.stringify(res);
  return p.output || p.text || '';
}

function appendEvent(body, type, payload) {
  switch (type) {
    case 'user_message': {
      const d = document.createElement('div');
      d.className = 'ev agent-text';
      d.style.borderLeftColor = 'var(--success)';
      d.innerHTML = `<div class="ev-label">User</div>${escHtml(payload.text || '')}`;
      body.appendChild(d); break;
    }
    case 'assistant_message': {
      const text = payload.text || '';
      if (!text.trim()) return;
      const last = body.lastElementChild;
      if (last?.dataset?.type === 'assistant_message') {
        last.innerHTML += escHtml(text);
        body.scrollTop = body.scrollHeight;
        return;
      }
      const d = document.createElement('div');
      d.className = 'ev agent-text';
      d.dataset.type = 'assistant_message';
      d.innerHTML = `<div class="ev-label">Agent</div>${escHtml(text)}`;
      body.appendChild(d); break;
    }
    case 'tool_call': {
      const toolName = extractName(payload);
      const title = extractTitle(payload);
      const tcId = payload.tool_call_id || payload.toolCallId || '';
      const details = document.createElement('details');
      details.className = 'tool-card';
      details.dataset.toolCallId = tcId;
      const summary = document.createElement('summary');
      summary.innerHTML = `<span class="tool-icon">&#9654;</span><span class="tool-label">${escHtml(toolName)}${title ? ' <span style="opacity:.55;font-weight:400">· ' + escHtml(title) + '</span>' : ''}</span><span class="tool-status waiting">running</span>`;
      const pre = document.createElement('pre');
      const args = payload.input || payload.args || {};
      pre.textContent = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
      details.append(summary, pre);
      body.appendChild(details); break;
    }
    case 'tool_result': {
      const tcId = payload.tool_call_id || payload.toolCallId || '';
      const cards = body.querySelectorAll('.tool-card');
      let card = null;
      for (let i = cards.length - 1; i >= 0; i--) {
        if (tcId && cards[i].dataset.toolCallId === tcId) { card = cards[i]; break; }
        if (!tcId && cards[i].querySelector('.tool-status.waiting')) { card = cards[i]; break; }
      }
      if (card) {
        const st = card.querySelector('.tool-status');
        if (st) { st.className = 'tool-status done'; st.textContent = 'done'; }
        card.querySelector('summary .tool-icon').textContent = '✓';
        let out = extractResult(payload);
        if (typeof out !== 'string') out = JSON.stringify(out);
        if (out.length > 2000) out = out.slice(0, 2000) + '\n… (truncated)';
        if (out.trim()) card.querySelector('pre').textContent += '\n─── result ───\n' + out;
      } else {
        const d = document.createElement('div');
        d.className = 'ev usage-ev';
        let out = extractResult(payload);
        if (typeof out !== 'string') out = JSON.stringify(out);
        d.textContent = out.slice(0, 500) || '(empty result)';
        body.appendChild(d);
      }
      break;
    }
    case 'reasoning': {
      const text = payload.text || '';
      if (!text.trim()) return;
      const last = body.lastElementChild;
      if (last?.dataset?.type === 'reasoning') {
        last.innerHTML += escHtml(text);
        body.scrollTop = body.scrollHeight;
        return;
      }
      const d = document.createElement('div');
      d.className = 'ev thinking';
      d.dataset.type = 'reasoning';
      d.innerHTML = `<div class="ev-label">Thinking</div>${escHtml(text)}`;
      body.appendChild(d); break;
    }
    case 'error': {
      const d = document.createElement('div');
      d.className = 'ev error-ev';
      d.innerHTML = `<div class="ev-label">Error</div>${escHtml(payload.message || payload.text || JSON.stringify(payload))}`;
      body.appendChild(d); break;
    }
    case 'usage': {
      const d = document.createElement('div');
      d.className = 'ev usage-ev';
      const i = payload.inputTokens || payload.input_tokens || 0;
      const o = payload.outputTokens || payload.output_tokens || 0;
      const c = payload.totalCostUsd || payload.total_cost_usd || 0;
      d.textContent = `${i.toLocaleString()} in · ${o.toLocaleString()} out${c ? ` · $${c.toFixed(4)}` : ''}`;
      body.appendChild(d); break;
    }
    case 'done':
    case 'system': {
      const d = document.createElement('div');
      d.className = 'ev usage-ev';
      d.textContent = payload.text || 'done';
      body.appendChild(d); break;
    }
    default: return;
  }
  body.scrollTop = body.scrollHeight;
}

function closeStream() {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  currentSessionId = null;
  document.getElementById('streamHeader').style.display = 'none';
  document.getElementById('streamBody').innerHTML = '<div class="stream-empty">Select a session to view its live event stream</div>';
  document.querySelectorAll('.session-item').forEach(i => i.classList.remove('selected'));
}

refresh();
setInterval(refresh, 8000);
</script>
</body>
</html>
