[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk"
version = "0.1.0"
description = "Agent orchestration server + Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    # Pinned: 0.184 changed AsyncDaytona.list into an async generator taking a
    # ListSandboxesQuery (was an awaitable list(labels=, page=)). Leaving this
    # unpinned let a fresh prod image silently pull the breaking API and dark the
    # daytona reconcile + orphan monitor. Bump deliberately.
    "daytona-sdk==0.184.0",
    "modal>=1.4.2",
    # Native runtime: one call signature across providers (anthropic /
    # openai / openrouter / bedrock / …), streaming + tool-calls included.
    "litellm>=1.51",
    # Faster JSON serialization for the per-turn native checkpoint write — the
    # full-transcript json.dumps runs on the event-loop thread (psycopg adapts
    # the param inline) and is the dominant deep-session cost (see
    # docs/native_checkpoint_writevolume_design.md). Optional at runtime: db.py
    # falls back to stdlib json if orjson is absent.
    "orjson>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk", "src/api"]

[dependency-groups]
# Test toolchain. pytest-xdist is LOAD-BEARING for every pytest invocation:
# the addopts below pass --dist, an xdist flag (loadgroup needs xdist>=2.5).
# Without xdist installed, even plain `pytest` errors on the unknown argument.
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "pytest-xdist>=3.2",
    "respx>=0.22",
]

[tool.pytest.ini_options]
# All tests gated on TEST_DATABASE_URL share ONE physical postgres database,
# so they must serialize onto a single xdist worker (they carry
# `pytest.mark.xdist_group("db")`) — otherwise parallel workers truncate each
# other's rows mid-test (clean_db) and the suite is order/parallelism-flaky.
# loadgroup distributes ungrouped tests exactly like the default `load`.
addopts = ["--dist", "loadgroup"]
