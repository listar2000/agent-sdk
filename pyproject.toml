[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk"
version = "0.1.0"
description = "Agent orchestration server + Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx",
    "fastapi",
    "uvicorn[standard]",
    "psycopg[binary]>=3.1",
    "psycopg_pool>=3.1",
    # Pinned: 0.184 changed AsyncDaytona.list into an async generator taking a
    # ListSandboxesQuery (was an awaitable list(labels=, page=)). Leaving this
    # unpinned let a fresh prod image silently pull the breaking API and dark the
    # daytona reconcile + orphan monitor. Bump deliberately.
    "daytona-sdk==0.184.0",
    "modal>=1.4.2",
    # Native runtime: one call signature across providers (anthropic /
    # openai / openrouter / bedrock / …), streaming + tool-calls included.
    "litellm>=1.51",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sdk", "src/api"]
